server.address=0.0.0.0
#spring.datasource.url=jdbc:postgresql://localhost:5432/task_mgmt
#server.port=8081
spring.datasource.url=jdbc:postgresql://192.168.14.191:5432/task_mgmt
spring.datasource.username=postgres
spring.datasource.password=0000


spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.data.jdbc.repositories.enabled=false
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=DEBUG
logging.level.com.telusko=DEBUG

# Session timeout: 30 minutes
server.servlet.session.timeout=30m

# Ensure cookies are usable from both /frontend and /task-mgmt
server.servlet.session.cookie.path=/
server.servlet.session.cookie.same-site=none

# Use secure=true only if you have HTTPS (production with SSL)
server.servlet.session.cookie.secure=false














