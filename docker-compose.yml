services:
  postgres:
    image: postgres:15
    container_name: taskmgmt-db
    environment:
      POSTGRES_DB: task_mgmt
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0000"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: taskmgmt-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_mgmt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: "0000"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  frontend:
    build:
      context: ./my-app
      dockerfile: Dockerfile
    container_name: taskmgmt-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
