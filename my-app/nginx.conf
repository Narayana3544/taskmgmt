server {
    listen 80;

    # Serve React build
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend API calls to the backend container
    # These are all the API endpoint prefixes used by the app
    location ~* ^/(login|logout|register|users|user|projects|project|features|feature|sprints|sprint|tasks|task|view-task|view-tasks|create-task|bugs|bug|view-bug|view-bugs|create-bug|addComment|viewComments|Priorities|getstatusForTask|gettype|getstatusForBug|attachments|time-sheets|timesheets|daily-timesheets|admin|active-sprints|userstories|userstory) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        # Forward cookies for session management
        proxy_pass_header Set-Cookie;
        proxy_cookie_path / /;
        # Handle large file uploads (50MB)
        client_max_body_size 200M;
    }

    # React router support (SPA fallback) - must be last
    location / {
        try_files $uri /index.html;
    }
}
