server {
    listen 80;

    # Serve React build at /taskmgmt subpath
    root /usr/share/nginx/html;
    index index.html;

    # Redirect root to /taskmgmt/
    location = / {
        return 301 /taskmgmt/;
    }

    # Serve static assets under /taskmgmt/static - no fallback needed
    location /taskmgmt/static/ {
        rewrite ^/taskmgmt/(.*)$ /$1 break;
    }

    # Serve React app at /taskmgmt - with SPA fallback
    location /taskmgmt/ {
        rewrite ^/taskmgmt/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    # Handle /taskmgmt without trailing slash
    location = /taskmgmt {
        return 301 /taskmgmt/;
    }

    # Proxy API requests to backend container
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
